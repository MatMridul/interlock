name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-fast:
    name: Python fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4.7.1  # some fast tests export the table through JFLAP
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements.txt
      - run: pytest -q --ignore=tests/test_mutation_m3.py --ignore=tests/test_replay_m5.py

  python-slow:
    name: Python slow suites (mutation, replay vs JFLAP)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_mutation_m3.py tests/test_replay_m5.py

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  executor-table:
    name: Executor table is fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - run: python scripts/gen_executor_table.py --check

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/secret_scan.py

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    continue-on-error: true  # report-only: findings are printed but do not fail the run
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - run: npm audit
        working-directory: ui
